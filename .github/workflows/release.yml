name: Build release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use the format v1.2.3: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build app
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHITECTURES: arm64 x86_64
        run: ./scripts/build-app.sh

      - name: Create release archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/KanaEn.app KanaEn.zip
          shasum -a 256 KanaEn.zip > KanaEn.zip.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" KanaEn.zip KanaEn.zip.sha256 --clobber
